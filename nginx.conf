# Portfolio de Hugo Córdoba — hugo.codeviaesp.com
#
# Mismo patrón que CODEVIA-DEMOS: nginx-proxy reenvía el Host original,
# así que este server_name recibe solo su tráfico.
#
# IMPORTANTE: el server_name es literal (nginx no soporta comodín de dos
# niveles tipo "hugo.*.com"). Si cambias PORTFOLIO_HUGO_DOMAIN en
# deploy/.env, actualiza también el server_name de aquí.
#
# A diferencia de las demos, este sitio SÍ debe indexarse: sin noindex.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json
           image/svg+xml application/xml font/woff2;

server {
    listen 80;
    server_name hugo.codeviaesp.com;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;

    # El HTML siempre se revalida: así un redeploy se ve al instante.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Las fuentes nunca cambian de contenido — cache agresiva.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Vite pone un hash en el nombre de todo lo de /assets/, así que un
    # fichero con ese nombre nunca cambia: cache máxima e inmutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # El resto de estáticos (favicon, imágenes de public/) sí conserva el
    # nombre entre despliegues: cache corta con revalidación.
    location ~* \.(jpg|jpeg|png|webp|avif|svg|ico)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Fallback si alguien entra por el hostname interno de Docker
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ /index.html; }
}
