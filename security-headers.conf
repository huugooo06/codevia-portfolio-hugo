# Cabeceras de seguridad.
#
# Van en un fichero aparte porque en nginx `add_header` NO se acumula entre
# niveles: si un `location` declara cualquier add_header propia, descarta
# todas las heredadas del `server`. Como varios locations definen su
# Cache-Control, declararlas solo a nivel de server las dejaba fuera de
# esas respuestas — incluida la del HTML, que es la que más las necesita.
#
# Por eso este fichero se incluye en el server Y en cada location que
# tenga add_header propia. Si se añade un location nuevo con add_header,
# hay que incluirlo ahí también.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
