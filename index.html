<script>
  // Resuelve el tema ANTES del primer paint para que no haya destello de color.
  // Debe quedarse inline aquí: desde el bundle de React llegaría tarde.
  (function () {
    var t = null;
    try { t = localStorage.getItem('hc-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches)
        ? 'light' : 'dark';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
